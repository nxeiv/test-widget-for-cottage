<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cottage★</title>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background:
            radial-gradient(circle at top, #30364a 0%, #181a22 45%, #101116 100%);
        color: white;
        padding: 24px;
    }

    .container {
        width: 100%;
        max-width: 900px;
        text-align: center;
    }

    .header {
        margin-bottom: 28px;
    }

    .logo {
        font-size: 52px;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 1px;
    }

    .subtitle {
        margin-top: 10px;
        color: #b9bdc9;
        font-size: 16px;
    }

    .card {
        background: rgba(25, 27, 36, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
    }

    .card-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 18px;
    }

    iframe {
        width: 100%;
        max-width: 350px;
        height: 500px;
        border: 0;
        border-radius: 12px;
    }

    .footer {
        margin-top: 22px;
        color: #777c8a;
        font-size: 13px;
    }

    .footer span {
        color: #aaaeba;
    }

    @media (max-width: 500px) {
      body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            rgba(10, 11, 16, 0.60),
            rgba(10, 11, 16, 0.60)
        ),
        url("leaves.gif");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: white;
    padding: 24px;
}
    }
</style>


</head>

<body>


<main class="container">

    <header class="header">
        <div class="logo">😝</div>
        <h1>The Cottage★</h1>
        <div class="subtitle">
           A little place to have fun, chill with members and laugh!! - @gring_gring6
        </div>
    </header>

    <section class="card">
        <div class="card-title">Come and join us! We're open everytime!</div>

        <iframe
            src="https://discord.com/widget?id=1398568016915992667&theme=dark"
            allowtransparency="true"
            frameborder="0"
            sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
        </iframe>
    </section>

    <div class="footer">
        The Cottage★ <span>•</span> Invite maintained by @Makkrabb
    </div>

</main>


</body>
</html>
