<!DOCTYPE html>

<style>
    * {
        box-sizing: border-box;
    }

    body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter", Arial, sans-serif;

    background:
        linear-gradient(
            rgba(10, 11, 16, 0.68),
            rgba(10, 11, 16, 0.68)
        ),
        url("2C58F125-5521-4799-A848-55533DF42A82.gif");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: white;
    padding: 24px;
}

    @keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

    .container {
    width: 100%;
    max-width: 900px;
    text-align: center;
    animation: fadeUp 0.6s ease-out;
}

    .header {
        margin-bottom: 28px;
    }

    .logo {
    margin-bottom: 12px;
}

.logo img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.30);
    transition:
    transform 0.25s ease,
    box-shadow 0.25s ease;
}

.logo img:hover {
    transform: scale(1.05);
    box-shadow:
        0 0 25px rgba(255, 255, 255, 0.50),
        0 8px 20px rgba(0, 0, 0, 0.25);
}

h1 {
    font-size: 32px;
    letter-spacing: -0.5px;
    margin: 0;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
}

h1 a {
    color: white;
    text-decoration: none;
    transition: opacity 0.2s ease;
}

h1 a:hover {
    opacity: 0.75;
}
    
.subtitle {
    margin-top: 10px;
    color: #c5c8cf;
    font-size: 15px;
    line-height: 1.6;
}

    .subtitle .creator {
    color: #7ee787;
    font-weight: bold;
}

   .card {
    background: rgba(25, 27, 36, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 24px;
    box-shadow:
    0 15px 50px rgba(0, 0, 0, 0.35),
    0 0 30px rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(14px);
}

    .card + .card {
    margin-top: 20px;
}

    .card:first-of-type {
    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.card:first-of-type:hover {
    background: rgba(255, 255, 255, 0.065);
    border-color: rgba(255, 255, 255, 0.14);
}
    
.card-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #f2f2f2;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.12);
}

    .smp-card p {
    margin: 0 0 18px 0;
    color: #c5c8cf;
    line-height: 1.6;
    font-size: 14px;
}

    .smp-card {
    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.smp-card:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.075);
    border-color: rgba(255, 255, 255, 0.16);
    box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.35),
        0 0 30px rgba(255, 255, 255, 0.06);
}
    
.smp-button {
    display: inline-block;
    margin-top: 4px;
    padding: 10px 18px;

    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;

    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;

    transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.smp-button:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(255, 255, 255, 0.08);
}
    
iframe {
    width: 100%;
    max-width: 350px;
    height: 500px;
    border: 0;
    border-radius: 12px;
    box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.25),
    0 0 18px rgba(255, 255, 255, 0.10);
}

.footer {
    margin-top: 22px;
    color: #aaaeba;
    font-size: 13px;
    line-height: 1.6;
}

.footer .footer-title {
    color: #ffffff;
    font-weight: 600;
}

.footer span {

}

.footer .maintained {
    color: #c5c8cf;
}

.footer .credit {
    color: #8fd8ff;
    font-weight: 600;
}

    .footer span {
    display: inline-block;
    margin: 0 2px;
}
    
@media (max-width: 500px) {
    body {
        padding: 16px;
    }

    h1 {
        font-size: 28px;
    }

    .subtitle {
        font-size: 14px;
    }

    .card {
        padding: 20px;
    }

    iframe {
        height: 450px;
    }
}

</style>

    </div>
</header>

    <section class="card">
        <div class="card-title">Come and join us! We're open everytime!</div>

        <iframe
            src="https://discord.com/widget?id=1398568016915992667&theme=dark"
            allowtransparency="true"
            frameborder="0"
            sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
        </iframe>
    </section>
    
    <section class="card smp-card">
        <div class="card-title">The Cottage★ SMP</div>

        <p>

        </p>

        <a href="smp.html" class="smp-button">View The Cottage★ SMP</a>

<div class="footer">

    <span>•</span>
